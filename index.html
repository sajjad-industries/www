    /* Values from brand/tokens/tokens.css (Sajjad Industries design tokens v1), inlined. */
    :root {
      --si-black: #000000;
      --si-white: #FFFFFF;
      --si-grey-300: #B0B0B0;
      --si-grey-700: #333333;
      --si-font-sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
      --si-space-4: 16px;
      --si-space-6: 24px;
      --si-space-8: 32px;
      --si-text-caption-size: 12px;
      --si-text-caption-line: 16px;
      --si-text-caption-tracking: 0.01em;
      --si-text-small-size: 14px;
      --si-text-small-line: 20px;
    }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--si-black);
      color: var(--si-white);
      font-family: var(--si-font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--si-space-8) var(--si-space-4);
      box-sizing: border-box;
      text-align: center;
    }
    .lockup { width: min(266px, 100%); height: auto; display: block; }
    p { margin: 0; }
    .note {
      margin-top: var(--si-space-6);
      font-size: var(--si-text-small-size);
      line-height: var(--si-text-small-line);
      color: var(--si-grey-300);
    }
    .legal {
      margin-top: var(--si-space-8);
      font-size: var(--si-text-caption-size);
      line-height: var(--si-text-caption-line);
      letter-spacing: var(--si-text-caption-tracking);
      color: var(--si-grey-300);
    }
    a { color: var(--si-white); text-decoration: none; border-bottom: 1px solid var(--si-grey-700); }
    a:hover { border-bottom-color: var(--si-white); }
  </style>
